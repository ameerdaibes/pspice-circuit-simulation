<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#111}
  .wire{stroke:#111;stroke-width:4;fill:none}
  .comp{stroke:#111;stroke-width:4;fill:white}
  .label{font-size:24px;font-weight:600}
  .small{font-size:21px}
  .node{fill:#111}
</style>
<rect width="100%" height="100%" fill="white"/>
<text x="550" y="42" text-anchor="middle" class="label">Problem 1 — DC Steady-State Circuit</text>

<!-- buses -->
<path class="wire" d="M150 140 V590"/>
<path class="wire" d="M900 140 V590"/>
<path class="wire" d="M150 590 H900"/>

<!-- top current source branch -->
<path class="wire" d="M150 140 H255"/>
<circle class="comp" cx="320" cy="140" r="42"/>
<path class="wire" d="M362 140 H650"/>
<path class="wire" d="M650 140 l18 -18 l18 36 l18 -36 l18 36 l18 -36 l18 36 l18 -18 H900"/>
<path class="wire" d="M340 140 H295"/>
<path class="wire" d="M295 140 l16 -10 M295 140 l16 10"/>
<text x="320" y="90" text-anchor="middle" class="small">6 mA</text>
<text x="760" y="108" text-anchor="middle" class="small">R4 = 5 kΩ</text>

<!-- middle resistor branch -->
<path class="wire" d="M150 270 H360"/>
<path class="wire" d="M360 270 l18 -18 l18 36 l18 -36 l18 36 l18 -36 l18 36 l18 -18 H900"/>
<text x="475" y="235" text-anchor="middle" class="small">R1 = 7 kΩ</text>

<!-- lower middle left resistor -->
<path class="wire" d="M150 410 H280"/>
<path class="wire" d="M280 410 l18 -18 l18 36 l18 -36 l18 36 l18 -36 l18 36 l18 -18 H500"/>
<text x="390" y="375" text-anchor="middle" class="small">R3 = 6 kΩ</text>

<!-- voltage source -->
<path class="wire" d="M500 410 H650"/>
<line class="wire" x1="690" y1="375" x2="690" y2="445"/>
<line class="wire" x1="730" y1="390" x2="730" y2="430"/>
<path class="wire" d="M650 410 H690 M730 410 H900"/>
<text x="710" y="350" text-anchor="middle" class="small">Vs1 = 7 V</text>
<text x="675" y="395" class="small">−</text><text x="742" y="395" class="small">+</text>

<!-- center 2k resistor -->
<path class="wire" d="M500 410 V465"/>
<path class="wire" d="M500 465 l-18 18 l36 18 l-36 18 l36 18 l-36 18 l18 18 V590"/>
<text x="545" y="525" class="small">2 kΩ</text>
<text x="525" y="565" class="small">I₀ ↓</text>

<!-- right R2 -->
<path class="wire" d="M900 410 V465"/>
<path class="wire" d="M900 465 l-18 18 l36 18 l-36 18 l36 18 l-36 18 l18 18 V590"/>
<text x="945" y="525" class="small">R2 = 7 kΩ</text>
<text x="930" y="565" class="small">I₂ ↓</text>

<!-- left current source -->
<path class="wire" d="M150 410 V470"/>
<circle class="comp" cx="150" cy="520" r="38"/>
<path class="wire" d="M150 558 V590"/>
<path class="wire" d="M150 540 V500"/>
<path class="wire" d="M150 500 l-10 16 M150 500 l10 16"/>
<text x="85" y="525" class="small">2 mA</text>

<!-- current labels -->
<text x="520" y="248" class="small">I₁ →</text>
<text x="380" y="395" class="small">I₃ →</text>

<!-- nodes -->
<circle class="node" cx="150" cy="270" r="7"/><circle class="node" cx="150" cy="410" r="7"/>
<circle class="node" cx="500" cy="410" r="7"/><circle class="node" cx="900" cy="270" r="7"/>
<circle class="node" cx="900" cy="410" r="7"/>

<text x="285" y="200" class="small">V₂ across current source</text>
</svg>